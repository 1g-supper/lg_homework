  <text x="400" y="510" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#8C2C2C" font-weight="700">300+ 注册用户</text>
  <text x="400" y="540" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#444444">商品发布 · 关键词检索 · 站内私信 · 信用评分</text>
