  <g>
    <rect x="530" y="120" width="210" height="300" rx="10" fill="#FCFAF6" stroke="#444444" stroke-width="1.2"/>
    <rect x="550" y="140" width="170" height="120" rx="6" fill="#D88A94" opacity="0.22"/>
    <circle cx="635" cy="200" r="26" fill="#D88A94" opacity="0.7"/>
    <text x="635" y="206" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#F7F3ED">🪑</text>
