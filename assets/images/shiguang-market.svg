<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="拾光集市二手交易平台界面示意图">
  <rect width="800" height="600" fill="#F7F3ED"/>
  <!-- 顶部栏 -->
  <rect x="40" y="30" width="720" height="56" rx="8" fill="#FCFAF6" stroke="#444444" stroke-width="1.5"/>
